<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b2b">
  <title>방구석 실험실 | 과학, 직접 해보면 다르다!</title>
  <style>
    :root {
      --bg: #101b2b;
      --panel: #1b2c40;
      --panel-hover: #263d56;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --sky: #7dd3fc;
      --line: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(56, 189, 248, .12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.6;
    }
    .wrap { width: min(980px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 24px; }
    header { display: flex; align-items: center; gap: 12px; color: #bae6fd; font-weight: 800; letter-spacing: .08em; font-size: .88rem; }
    .logo { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #38536d; background: #1b3046; border-radius: 14px; font-size: 1.35rem; }
    .hero { padding: 58px 0 36px; }
    .eyebrow { color: var(--sky); font-size: .9rem; font-weight: 750; margin: 0 0 10px; }
    h1 { font-size: clamp(2.5rem, 7vw, 4.7rem); line-height: 1.1; letter-spacing: -.055em; margin: 0 0 18px; }
    .hero h2 { color: var(--sky); font-size: clamp(1.15rem, 3vw, 1.6rem); margin: 0 0 12px; }
    .intro { max-width: 620px; color: var(--muted); font-size: 1.05rem; margin: 0; }
    .section-top { border-top: 1px solid var(--line); padding-top: 30px; display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .section-top h2 { margin: 0; font-size: clamp(1.35rem, 4vw, 1.8rem); }
    .section-top p { margin: 4px 0 0; color: #94a3b8; font-size: .92rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .experiment {
      text-align: left; width: 100%; color: var(--text); border: 1px solid #30445b;
      border-radius: 20px; padding: 22px; background: linear-gradient(145deg, #1d3045, #18283a);
      cursor: pointer; min-height: 188px; transition: transform .18s ease, border-color .18s ease, background .18s ease;
      font: inherit;
    }
    .experiment:hover, .experiment:focus-visible { transform: translateY(-3px); border-color: #7dd3fc; background: var(--panel-hover); outline: none; }
    .experiment:focus-visible { box-shadow: 0 0 0 3px rgba(125, 211, 252, .25); }
    .emoji { font-size: 1.8rem; display: block; margin-bottom: 13px; }
    .card-title { display: block; font-size: 1.16rem; font-weight: 800; margin-bottom: 3px; }
    .card-desc { display: block; color: var(--muted); font-size: .93rem; }
    .tag { display: inline-block; margin-top: 14px; padding: 4px 9px; border-radius: 999px; background: #334155; color: #e2e8f0; font-size: .76rem; font-weight: 700; }
    .detail { display: none; margin-top: 22px; padding: 24px; border: 1px solid #38536d; border-radius: 20px; background: #142438; }
    .detail.show { display: block; }
    .detail h3 { font-size: 1.5rem; margin: 0 0 8px; }
    .detail p { color: var(--muted); }
    .back { border: 0; border-radius: 12px; background: var(--sky); color: #082032; padding: 11px 16px; font-weight: 800; cursor: pointer; font-size: .95rem; }
    footer { margin-top: 38px; padding-top: 18px; border-top: 1px solid var(--line); color: #94a3b8; text-align: center; font-size: .82rem; }
    @media (max-width: 560px) {
      .wrap { width: min(100% - 26px, 980px); padding-top: 18px; }
      .hero { padding-top: 44px; }
      .grid { grid-template-columns: 1fr; }
      .experiment { min-height: 0; padding: 20px; }
      .section-top { align-items: start; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo" aria-hidden="true">⚗️</div>
      <div>BANG-GUSEOK LAB</div>
    </header>

    <section class="hero" aria-labelledby="main-title">
      <p class="eyebrow">통합과학 1 · 통합과학 2</p>
      <h1 id="main-title">방구석 실험실</h1>
      <h2>과학, 직접 해보면 다르다!</h2>
      <p class="intro">어려운 과학 개념을 실험과 시뮬레이션으로 탐구해 보세요. 먼저 결과를 예측하고, 조건을 바꾸며, 왜 그런 결과가 나오는지 알아봐요.</p>
    </section>

    <section aria-labelledby="experiments-title">
      <div class="section-top">
        <div>
          <h2 id="experiments-title">어떤 실험을 해볼까요?</h2>
          <p>관심 있는 주제를 선택해 시작해 보세요.</p>
        </div>
      </div>

      <div class="grid">
        <button class="experiment" data-topic="neutralization">
          <span class="emoji" aria-hidden="true">💧</span>
          <span class="card-title">중화 반응</span>
          <span class="card-desc">산과 염기가 만나면 어떤 변화가 생길까?</span>
          <span class="tag">실험 준비 중</span>
        </button>
        <button class="experiment" data-topic="redox">
          <span class="emoji" aria-hidden="true">⚡</span>
          <span class="card-title">산화·환원</span>
          <span class="card-desc">전자 이동으로 일어나는 변화를 알아봐요.</span>
          <span class="tag">실험 준비 중</span>
        </button>
        <button class="experiment" data-topic="impulse">
          <span class="emoji" aria-hidden="true">🎯</span>
          <span class="card-title">충격량</span>
          <span class="card-desc">힘과 작용 시간은 운동 변화에 어떤 영향을 줄까?</span>
          <span class="tag">실험 준비 중</span>
        </button>
        <button class="experiment" data-topic="acceleration">
          <span class="emoji" aria-hidden="true">🚀</span>
          <span class="card-title">가속도 운동</span>
          <span class="card-desc">시간에 따라 속도가 어떻게 변하는지 살펴봐요.</span>
          <span class="tag">실험 준비 중</span>
        </button>
      </div>

      <section class="detail" id="detail" aria-live="polite">
        <h3 id="detail-title">실험</h3>
        <p id="detail-text">이 실험은 다음 단계에서 만들 예정이에요.</p>
        <p><strong>현재 단계:</strong> 메인 화면 제작 완료. 실험 기능은 차례대로 추가할 예정입니다.</p>
        <button class="back" id="back-button" type="button">← 실험 목록으로 돌아가기</button>
      </section>
    </section>

    <footer>작은 질문에서 시작하는 과학 탐구 · 방구석 실험실</footer>
  </main>

  <script>
    const topics = {
      neutralization: {
        title: "중화 반응",
        text: "산과 염기가 반응할 때 용액의 성질이 어떻게 달라지는지 탐구하는 실험이에요. 다음 단계에서 조건을 선택하고 결과를 예측하는 기능을 추가할 거예요."
      },
      redox: {
        title: "산화·환원",
        text: "산화와 환원이 전자 이동과 어떻게 연결되는지 탐구하는 실험이에요. 다음 단계에서 반응 모형과 해설을 추가할 거예요."
      },
      impulse: {
        title: "충격량",
        text: "힘이 작용하는 시간과 운동량 변화의 관계를 알아보는 실험이에요. 다음 단계에서 조건을 바꾸는 시뮬레이션을 추가할 거예요."
      },
      acceleration: {
        title: "가속도 운동",
        text: "시간에 따른 속도와 위치의 변화를 살펴보는 실험이에요. 다음 단계에서 움직임과 그래프를 연결하는 기능을 추가할 거예요."
      }
    };

    const detail = document.getElementById("detail");
    const detailTitle = document.getElementById("detail-title");
    const detailText = document.getElementById("detail-text");
    const cards = document.querySelectorAll(".experiment");

    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const topic = topics[card.dataset.topic];
        detailTitle.textContent = topic.title;
        detailText.textContent = topic.text;
        detail.classList.add("show");
        detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    });

    document.getElementById("back-button").addEventListener("click", () => {
      detail.classList.remove("show");
    });
  </script>
</body>
</html>
